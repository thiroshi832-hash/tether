name: Tether macOS build

# Builds the unsigned Tether.app -> tether-<ver>.dmg on GitHub's macOS runners,
# so a Mac with a too-old OS (or no Mac) isn't needed. Runs on push to the
# feature branch and via the manual "Run workflow" button.
on:
  workflow_dispatch:
  push:
    branches: [feat/linux-macos-builds]
    paths:
      - '.github/workflows/tether-macos.yml'
      - 'src/**'
      - 'flutter/**'
      - 'build.py'
      - 'Cargo.*'
      - 'hbb_common_fork.patch'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14      # Apple Silicon
            arch: arm64
            triplet: arm64-osx
            name: arm64
          - os: macos-15-intel  # Intel (macos-13 runners were retired)
            arch: x86_64
            triplet: x64-osx
            name: x86_64
          # EXPERIMENTAL: Intel build with the minimum lowered to 10.13 (High
          # Sierra). Flutter 3.24 officially needs 10.14, so this may fail to
          # build or crash at launch; it never blocks the other two.
          - os: macos-15-intel
            arch: x86_64
            triplet: x64-osx
            name: x86_64-10.13
            min_macos: '10.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      FLUTTER_VERSION: 3.24.5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false   # we init hbb_common manually to apply the crypto patch

      # Lower the deployment target everywhere it is pinned (same spots upstream
      # rewrites for its arm64 build). The env var also reaches vcpkg's CMake
      # builds and rustc. BSD sed on macOS needs `-i ''`.
      # Flutter 3.24's MacOSDeploymentTargetMigration rewrites the exact string
      # "MACOSX_DEPLOYMENT_TARGET = 10.13;" to 10.14 on every build, so the Xcode
      # project gets "10.13.0" instead. Pods/plugins stay at 10.14: their imports
      # were checked against the 10.13 SDK and none are missing.
      - name: Lower minimum macOS
        if: matrix.min_macos != ''
        run: |
          V='${{ matrix.min_macos }}'
          sed -i '' -E "s/MACOSX_DEPLOYMENT_TARGET=[0-9]+\.[0-9]+/MACOSX_DEPLOYMENT_TARGET=$V/" build.py
          sed -i '' -E "s/osx_minimum_system_version = \"[0-9]+\.[0-9]+\"/osx_minimum_system_version = \"$V\"/" Cargo.toml
          sed -i '' -E "s/MACOSX_DEPLOYMENT_TARGET = [0-9]+\.[0-9]+;/MACOSX_DEPLOYMENT_TARGET = $V.0;/" flutter/macos/Runner.xcodeproj/project.pbxproj
          echo "MACOSX_DEPLOYMENT_TARGET=$V" >> "$GITHUB_ENV"
          grep -n "MACOSX_DEPLOYMENT_TARGET\|osx_minimum" build.py Cargo.toml flutter/macos/Runner.xcodeproj/project.pbxproj

      # --- hbb_common fork (base a920d00 + our X25519 crypto patch) ---
      - name: Populate hbb_common and apply crypto fork patch
        run: |
          git submodule update --init libs/hbb_common
          git -C libs/hbb_common apply "$GITHUB_WORKSPACE/hbb_common_fork.patch"
          test -f libs/hbb_common/src/crypto.rs && echo "crypto fork applied"

      # --- Rust toolchain + bridge codegen tool ---
      - name: Set up Rust
        run: |
          rustup default stable
          # build.py builds for the host arch; its target is already installed.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry + frb tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-

      - name: Install flutter_rust_bridge_codegen
        run: |
          which flutter_rust_bridge_codegen || cargo install --locked flutter_rust_bridge_codegen@1.80.1
          which cargo-expand || cargo install --locked cargo-expand@1.0.95

      # --- Homebrew build tools ---
      - name: Install build tools
        run: brew install nasm yasm ninja create-dmg pkg-config cmake

      # --- Flutter 3.24.5 (git clone so the dropdown patch applies) ---
      - name: Set up Flutter
        run: |
          git clone -b "$FLUTTER_VERSION" --depth 1 https://github.com/flutter/flutter.git "$HOME/flutter-sdk"
          echo "$HOME/flutter-sdk/bin" >> "$GITHUB_PATH"
          "$HOME/flutter-sdk/bin/flutter" precache --macos
          git -C "$HOME/flutter-sdk" apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff" \
            || echo "::warning::dropdown_menu patch did not apply cleanly (may be unneeded on this SDK)"

      # --- vcpkg codec dependencies (cached) ---
      - name: Cache vcpkg installed
        uses: actions/cache@v4
        with:
          path: ~/vcpkg/installed
          key: vcpkg-${{ matrix.triplet }}${{ matrix.min_macos }}-${{ hashFiles('vcpkg.json') }}

      - name: Set up vcpkg + install deps
        run: |
          if [ ! -x "$HOME/vcpkg/vcpkg" ]; then
            # ~/vcpkg may already exist because the "Cache vcpkg installed" step
            # restored ~/vcpkg/installed. Clone into a temp dir and copy the repo
            # in so we don't clobber the restored installed/ (a direct clone into
            # a non-empty ~/vcpkg is a fatal git error).
            rm -rf /tmp/vcpkg-src
            git clone https://github.com/microsoft/vcpkg /tmp/vcpkg-src
            git -C /tmp/vcpkg-src checkout "$(grep -o '[0-9a-f]\{40\}' "$GITHUB_WORKSPACE/vcpkg.json" | head -1)"
            mkdir -p "$HOME/vcpkg"
            cp -R /tmp/vcpkg-src/. "$HOME/vcpkg/"
            "$HOME/vcpkg/bootstrap-vcpkg.sh"
          fi
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          "$HOME/vcpkg/vcpkg" install --triplet ${{ matrix.triplet }} --x-install-root="$HOME/vcpkg/installed"

      # --- Resolve Dart packages BEFORE codegen: ffigen (invoked by the bridge
      # codegen) needs flutter/.dart_tool/package_config.json to exist. ---
      - name: flutter pub get
        run: |
          cd flutter
          flutter pub get

      - name: Bridge codegen
        run: |
          flutter_rust_bridge_codegen \
            --rust-input src/flutter_ffi.rs \
            --dart-output flutter/lib/generated_bridge.dart \
            --c-output flutter/macos/Runner/bridge_generated.h

      # --- Build the app + dmg (build.py forces ad-hoc unsigned) ---
      - name: Build Tether macOS
        run: |
          export VCPKG_ROOT="$HOME/vcpkg"
          python3 build.py --flutter

      # Fail loudly if the lowered build still ends up gated or linked above
      # the target (the first 10.13 attempt silently shipped 10.14).
      - name: Verify minimum macOS
        if: matrix.min_macos != ''
        run: |
          APP=flutter/build/macos/Build/Products/Release/Tether.app
          PL=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist")
          echo "LSMinimumSystemVersion=$PL"
          bad=0
          [ "$PL" = "${{ matrix.min_macos }}.0" ] || [ "$PL" = "${{ matrix.min_macos }}" ] || bad=1
          for f in "$APP/Contents/MacOS/"* "$APP/Contents/Frameworks/liblibrustdesk.dylib"; do
            m=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit} /LC_VERSION_MIN_MACOSX/{v=1} v&&/version/{print $2; exit}')
            echo "$m  ${f#$APP/}"
            case "$m" in 10.14*|10.15*|1[1-9]*) bad=1 ;; esac
          done
          exit $bad

      - name: Upload dmg
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tether-macos-${{ matrix.name }}
          path: tether-*.dmg
          if-no-files-found: warn

      # Fallback: if create-dmg/packaging was skipped, still surface the .app
      - name: Upload app bundle (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tether-macos-${{ matrix.name }}-app
          path: flutter/build/macos/Build/Products/Release/Tether.app
          if-no-files-found: ignore
