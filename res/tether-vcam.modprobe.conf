# v4l2loopback options for the Tether virtual camera.
#
# video_nr: fixed device number so /dev/video63 is always the Tether device.
# card_label: name apps see in device pickers ("Tether Camera").
# exclusive_caps: expose only V4L2_CAP_VIDEO_CAPTURE to consumer apps (Chrome,
#                 Zoom, Teams enumerate capture-capable devices).
options v4l2loopback video_nr=63 card_label="Tether Camera" exclusive_caps=1
